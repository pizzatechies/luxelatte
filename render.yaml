# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: luxe-latte
    runtime: node
    plan: starter            # needed for the persistent disk that stores orders
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/site
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you to type this in during setup
      # M-Pesa prompts (STK Push). Leave blank to keep manual Paybill only.
      - key: PUBLIC_URL
        sync: false          # e.g. https://luxe-latte.onrender.com
      - key: MPESA_ENV
        value: production
      - key: MPESA_TYPE
        value: paybill
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
    disk:
      name: luxe-data
      mountPath: /var/data
      sizeGB: 1
